<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quên mật khẩu — ShopNest</title>
  <meta name="description" content="Khôi phục mật khẩu tài khoản ShopNest của bạn." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <a href="index.html">🏠 Shop<span>Nest</span></a>
      </div>

      <h1 class="auth-title">Quên mật khẩu?</h1>
      <p class="auth-sub">Nhập email đã đăng ký, chúng tôi sẽ gửi link đặt lại mật khẩu cho bạn</p>

      <!-- Success state (hidden by default) -->
      <div id="successState" style="display:none;">
        <div style="text-align:center;padding:24px 0;">
          <div style="font-size:48px;margin-bottom:12px;">📧</div>
          <h3 style="color:var(--primary);margin-bottom:8px;">Đã gửi email!</h3>
          <p style="color:var(--text-secondary);font-size:14px;line-height:1.6;">
            Nếu email tồn tại trong hệ thống, bạn sẽ nhận được link đặt lại mật khẩu. 
            Vui lòng kiểm tra hộp thư (và cả mục Spam).
          </p>
          <div style="margin-top:16px;">
            <a href="login.html" class="btn btn-primary btn-lg" style="display:inline-block;">← Quay lại đăng nhập</a>
          </div>
        </div>
      </div>

      <!-- Form (visible by default) -->
      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="emailInput">Email</label>
          <input class="form-control" type="email" id="emailInput" placeholder="you@example.com" autocomplete="email" />
          <div class="form-error" id="emailError"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Gửi link đặt lại mật khẩu</button>
      </form>

      <!-- Switch -->
      <div class="auth-switch">
        Đã nhớ mật khẩu? <a href="login.html">Đăng nhập</a>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
  /* ============================================
     Forgot Password Script
  ============================================ */

  const form     = document.getElementById('forgotForm');
  const emailIn  = document.getElementById('emailInput');
  const emailErr = document.getElementById('emailError');

  function validateEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    emailErr.textContent = '';
    emailIn.classList.remove('error');

    const email = emailIn.value.trim();

    if (!email) {
      emailErr.textContent = 'Vui lòng nhập email';
      emailIn.classList.add('error');
      return;
    }
    if (!validateEmail(email)) {
      emailErr.textContent = 'Email không hợp lệ';
      emailIn.classList.add('error');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Đang gửi...';

    try {
      await authAPI.forgotPassword(email);
      // Hiển thị trạng thái thành công
      form.style.display = 'none';
      document.getElementById('successState').style.display = 'block';
    } catch (err) {
      showToast(err.message || 'Có lỗi xảy ra', 'error');
      btn.disabled = false;
      btn.textContent = 'Gửi link đặt lại mật khẩu';
    }
  });

  // Redirect if already logged in
  if (Auth.isLoggedIn()) {
    location.href = 'index.html';
  }
  </script>
</body>
</html>
