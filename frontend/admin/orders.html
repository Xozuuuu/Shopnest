<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý đơn hàng — ShopNest Admin</title>
  <meta name="description" content="Quản lý và xử lý đơn hàng trên ShopNest — Cập nhật trạng thái giao hàng." />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    /* ── Orders Admin specific ────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toolbar-left input, .toolbar-left select {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }
    .toolbar-left input:focus, .toolbar-left select:focus { border-color: var(--primary); }

    .order-status-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .order-status-tab {
      padding: 6px 16px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--bg-white);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
    }
    .order-status-tab:hover { border-color: var(--primary); color: var(--primary); }
    .order-status-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .order-detail-expand {
      background: var(--bg-page);
      padding: 16px;
      border-top: 1px solid var(--border);
      display: none;
    }
    .order-detail-expand.open { display: block; }
    .order-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 13px;
    }
    @media (max-width: 768px) { .order-detail-grid { grid-template-columns: 1fr; } }
    .od-label { color: var(--text-muted); font-size: 12px; display: block; margin-bottom: 2px; }
    .od-value { font-weight: 600; color: var(--text-primary); }

    .order-items-list {
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .order-item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 13px;
    }
    .order-item-thumb {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .status-select {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }
    .status-select:focus { border-color: var(--primary); }

    .expand-btn {
      font-size: 12px;
      color: var(--primary);
      cursor: pointer;
      font-weight: 600;
      transition: opacity var(--transition);
    }
    .expand-btn:hover { opacity: .7; }
  </style>
</head>
<body>

  <!-- ╔══════════════════════════════════════╗
       ║          ADMIN NAVBAR                 ║
       ╚══════════════════════════════════════╝ -->
  <header class="navbar">
    <div class="navbar-inner">
      <a href="../index.html" class="logo">
        <span class="logo-icon">🏠</span>
        <span class="logo-text">Shop<b>Nest</b></span>
      </a>
      <div class="search-bar">
        <input type="text" placeholder="Tìm kiếm trong admin..." autocomplete="off" />
        <button class="search-btn">🔍</button>
      </div>
      <div class="nav-actions">
        <span class="nav-btn" style="cursor:default;">
          <span class="badge badge-primary" style="font-size:12px;">👑 Admin</span>
        </span>
        <div class="user-menu">
          <button class="nav-btn">👤 <span id="navUserName">Admin</span> ▾</button>
          <div class="user-dropdown">
            <a href="../index.html">🏠 Về trang chủ</a>
            <a href="../profile.html">👤 Hồ sơ cá nhân</a>
            <a href="#" id="logoutBtn" class="divider">🚪 Đăng xuất</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ╔══════════════════════════════════════╗
       ║          ADMIN LAYOUT                 ║
       ╚══════════════════════════════════════╝ -->
  <div class="admin-layout">

    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <a href="dashboard.html" class="admin-menu-item"><span>📊</span> Dashboard</a>
      <a href="products.html" class="admin-menu-item"><span>📦</span> Sản phẩm</a>
      <a href="orders.html" class="admin-menu-item active"><span>🛒</span> Đơn hàng</a>
      <a href="users.html" class="admin-menu-item"><span>👥</span> Người dùng</a>
      <div style="border-top:1px solid var(--border);margin:16px 0;"></div>
      <a href="../index.html" class="admin-menu-item"><span>🏠</span> Về trang chủ</a>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <h1 class="admin-page-title">🛒 Quản lý đơn hàng</h1>

      <!-- Stats -->
      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-icon orange">📋</div>
          <div>
            <div class="stat-value" id="statTotal">0</div>
            <div class="stat-label">Tổng đơn hàng</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon yellow">⏳</div>
          <div>
            <div class="stat-value" id="statPending">0</div>
            <div class="stat-label">Chờ xác nhận</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue">🚚</div>
          <div>
            <div class="stat-value" id="statShipping">0</div>
            <div class="stat-label">Đang giao</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">✅</div>
          <div>
            <div class="stat-value" id="statDelivered">0</div>
            <div class="stat-label">Hoàn thành</div>
          </div>
        </div>
      </div>

      <!-- Status Tabs -->
      <div class="order-status-tabs">
        <button class="order-status-tab active" data-status="all" onclick="filterOrders('all', this)">Tất cả</button>
        <button class="order-status-tab" data-status="pending" onclick="filterOrders('pending', this)">⏳ Chờ xác nhận</button>
        <button class="order-status-tab" data-status="confirmed" onclick="filterOrders('confirmed', this)">✅ Đã xác nhận</button>
        <button class="order-status-tab" data-status="shipping" onclick="filterOrders('shipping', this)">🚚 Đang giao</button>
        <button class="order-status-tab" data-status="delivered" onclick="filterOrders('delivered', this)">📦 Đã giao</button>
        <button class="order-status-tab" data-status="cancelled" onclick="filterOrders('cancelled', this)">❌ Đã hủy</button>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="toolbar-left">
          <input type="text" id="orderSearch" placeholder="🔍 Tìm mã đơn, khách hàng..." oninput="renderOrders()" />
        </div>
        <span style="font-size:13px;color:var(--text-muted);" id="showingCount"></span>
      </div>

      <!-- Orders Table -->
      <div class="card">
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Mã đơn</th>
                <th>Khách hàng</th>
                <th>SĐT</th>
                <th>Sản phẩm</th>
                <th>Tổng tiền</th>
                <th>Thanh toán</th>
                <th>Trạng thái</th>
                <th>Ngày đặt</th>
                <th>Chi tiết</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Pagination -->
      <div class="pagination" id="pagination"></div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script>
  /* ============================================
     Admin Orders Script
  ============================================ */

  const STATUS_MAP = {
    pending:   { label:'Chờ xác nhận', badge:'badge-warning'  },
    confirmed: { label:'Đã xác nhận',  badge:'badge-info'     },
    shipping:  { label:'Đang giao',    badge:'badge-info'     },
    delivered: { label:'Đã giao',      badge:'badge-success'  },
    cancelled: { label:'Đã hủy',       badge:'badge-danger'   },
  };
  const STATUS_OPTIONS = ['pending','confirmed','shipping','delivered','cancelled'];
  const STORAGE_KEY = 'sn_admin_orders';
  const PER_PAGE = 8;
  let currentPage = 1;
  let currentFilter = 'all';

  /* ── Orders Store ───────────────────────── */
  function getOrders() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) return JSON.parse(stored);

    // Also merge user orders from frontend
    const userOrders = JSON.parse(localStorage.getItem('sn_orders') || '[]');

    const defaults = [
      {
        id:'SN2405A1', date:'17/05/2024', status:'pending',
        name:'Trần Minh Tuấn', phone:'0901111222', address:'45 Lý Tự Trọng, Q.1, TP.HCM',
        payment:'Thanh toán khi nhận hàng',
        items:[
          { name:'iPhone 15 Pro Max 256GB', price:29990000, quantity:1, icon:'📱', bg:'#E8F4FD' },
          { name:'Tai nghe Sony WH-1000XM5', price:6990000, quantity:1, icon:'🎧', bg:'#FFF0F0' },
        ],
        subtotal:36980000, shipping:0, total:36980000,
      },
      {
        id:'SN2405A2', date:'17/05/2024', status:'pending',
        name:'Nguyễn Thị Lan', phone:'0903334455', address:'123 Nguyễn Huệ, Q.1, TP.HCM',
        payment:'Ví điện tử',
        items:[
          { name:'Kem dưỡng da Innisfree 50ml', price:220000, quantity:3, icon:'🧴', bg:'#FCE4EC' },
        ],
        subtotal:660000, shipping:0, total:660000,
      },
      {
        id:'SN2405A3', date:'16/05/2024', status:'confirmed',
        name:'Phạm Văn Đức', phone:'0905556677', address:'789 Cách Mạng Tháng 8, Q.10, TP.HCM',
        payment:'Chuyển khoản ngân hàng',
        items:[
          { name:'Áo thun nam Polo Premium', price:299000, quantity:2, icon:'👕', bg:'#FEF9EF' },
          { name:'Quần jean nữ Skinny Hàn Quốc', price:389000, quantity:1, icon:'👖', bg:'#E0F7FA' },
        ],
        subtotal:987000, shipping:0, total:987000,
      },
      {
        id:'SN2405A4', date:'16/05/2024', status:'shipping',
        name:'Lê Hoàng Nam', phone:'0907778899', address:'56 Hai Bà Trưng, Q.3, TP.HCM',
        payment:'Thanh toán khi nhận hàng',
        items:[
          { name:'Laptop Asus VivoBook 15 2024', price:13990000, quantity:1, icon:'💻', bg:'#E3F2FD' },
        ],
        subtotal:13990000, shipping:0, total:13990000,
      },
      {
        id:'SN2405A5', date:'15/05/2024', status:'delivered',
        name:'Đỗ Thu Hà', phone:'0909990011', address:'12 Trần Hưng Đạo, Q.5, TP.HCM',
        payment:'Ví điện tử',
        items:[
          { name:'Bộ sách Đắc Nhân Tâm (Combo)', price:85000, quantity:5, icon:'📖', bg:'#F3E5F5' },
        ],
        subtotal:425000, shipping:0, total:425000,
      },
      {
        id:'SN2405A6', date:'14/05/2024', status:'delivered',
        name:'Vũ Quang Huy', phone:'0901122334', address:'34 Pasteur, Q.1, TP.HCM',
        payment:'Chuyển khoản ngân hàng',
        items:[
          { name:'Samsung Galaxy S24 Ultra', price:24990000, quantity:1, icon:'📱', bg:'#EDE7F6' },
        ],
        subtotal:24990000, shipping:0, total:24990000,
      },
      {
        id:'SN2405A7', date:'13/05/2024', status:'cancelled',
        name:'Hoàng Thị Mai', phone:'0903344556', address:'78 Lê Lợi, Q.1, TP.HCM',
        payment:'Thanh toán khi nhận hàng',
        items:[
          { name:'Nồi cơm điện Panasonic 1.8L', price:890000, quantity:1, icon:'🍚', bg:'#FFF3E0' },
        ],
        subtotal:890000, shipping:30000, total:920000,
      },
      ...userOrders,
    ];

    localStorage.setItem(STORAGE_KEY, JSON.stringify(defaults));
    return defaults;
  }

  function saveOrders(orders) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
    // Also sync to frontend orders
    localStorage.setItem('sn_orders', JSON.stringify(orders));
  }

  /* ── Render ─────────────────────────────── */
  function renderOrders() {
    let orders = getOrders();

    // Stats
    const counts = { pending:0, confirmed:0, shipping:0, delivered:0, cancelled:0 };
    orders.forEach(o => { if (counts[o.status] !== undefined) counts[o.status]++; });
    document.getElementById('statTotal').textContent     = orders.length;
    document.getElementById('statPending').textContent    = counts.pending;
    document.getElementById('statShipping').textContent   = counts.shipping + counts.confirmed;
    document.getElementById('statDelivered').textContent  = counts.delivered;

    // Filter by status
    if (currentFilter !== 'all') {
      orders = orders.filter(o => o.status === currentFilter);
    }

    // Filter by search
    const q = document.getElementById('orderSearch').value.trim().toLowerCase();
    if (q) orders = orders.filter(o => o.id.toLowerCase().includes(q) || o.name.toLowerCase().includes(q));

    document.getElementById('showingCount').textContent = `${orders.length} đơn hàng`;

    // Pagination
    const totalPages = Math.ceil(orders.length / PER_PAGE);
    const start = (currentPage - 1) * PER_PAGE;
    const pageOrders = orders.slice(start, start + PER_PAGE);

    // Render
    document.getElementById('ordersTableBody').innerHTML = pageOrders.map(o => {
      const st = STATUS_MAP[o.status] || STATUS_MAP.pending;
      const itemCount = o.items ? o.items.reduce((s, i) => s + i.quantity, 0) : 0;

      const statusSelect = `
        <select class="status-select" onchange="changeStatus('${o.id}', this.value)">
          ${STATUS_OPTIONS.map(s => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${STATUS_MAP[s].label}</option>`).join('')}
        </select>`;

      const detailHtml = o.items ? `
        <tr class="order-detail-expand" id="detail-${o.id}">
          <td colspan="9" style="padding:0;">
            <div style="padding:16px;background:var(--bg-page);">
              <div class="order-detail-grid">
                <div><span class="od-label">Địa chỉ giao hàng</span><span class="od-value">${o.address || '—'}</span></div>
                <div><span class="od-label">Thanh toán</span><span class="od-value">${o.payment || '—'}</span></div>
                <div><span class="od-label">Phí ship</span><span class="od-value">${o.shipping ? formatPrice(o.shipping) : 'Miễn phí'}</span></div>
                <div><span class="od-label">Ghi chú</span><span class="od-value">${o.note || 'Không có'}</span></div>
              </div>
              <div class="order-items-list">
                ${o.items.map(item => `
                  <div class="order-item-row">
                    <div class="order-item-thumb" style="background:${item.bg || '#F5F5F5'}">${item.icon || '📦'}</div>
                    <span style="flex:1;">${item.name}</span>
                    <span style="color:var(--text-muted);">×${item.quantity}</span>
                    <span style="font-weight:700;color:var(--primary);">${formatPrice(item.price * item.quantity)}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </td>
        </tr>` : '';

      return `
        <tr>
          <td style="font-weight:700;">${o.id}</td>
          <td>${o.name}</td>
          <td style="color:var(--text-muted);">${o.phone || '—'}</td>
          <td>${itemCount} SP</td>
          <td style="font-weight:700;color:var(--primary);">${formatPrice(o.total)}</td>
          <td style="font-size:12px;color:var(--text-muted);">${o.payment || '—'}</td>
          <td>${statusSelect}</td>
          <td style="color:var(--text-muted);">${o.date}</td>
          <td><span class="expand-btn" onclick="toggleDetail('${o.id}')">📋 Chi tiết</span></td>
        </tr>
        ${detailHtml}`;
    }).join('');

    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    const el = document.getElementById('pagination');
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    let html = `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage-1})">‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
    }
    html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage+1})">›</button>`;
    el.innerHTML = html;
  }

  function goPage(p) { currentPage = p; renderOrders(); }

  /* ── Filter by status tab ───────────────── */
  function filterOrders(status, btn) {
    currentFilter = status;
    currentPage = 1;
    document.querySelectorAll('.order-status-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderOrders();
  }

  /* ── Change Status ──────────────────────── */
  function changeStatus(orderId, newStatus) {
    const orders = getOrders();
    const order = orders.find(o => o.id === orderId);
    if (order) {
      order.status = newStatus;
      saveOrders(orders);
      showToast(`Đơn #${orderId} → ${STATUS_MAP[newStatus].label}`, 'success');
      renderOrders();
    }
  }

  /* ── Toggle Detail ──────────────────────── */
  function toggleDetail(orderId) {
    const el = document.getElementById(`detail-${orderId}`);
    if (el) {
      el.style.display = el.style.display === 'table-row' ? 'none' : 'table-row';
    }
  }

  /* ── Navbar ─────────────────────────────── */
  const user = Auth.getUser();
  if (user) {
    const el = document.getElementById('navUserName');
    if (el) el.textContent = user.name ? user.name.split(' ').pop() : 'Admin';
  }

  /* ── Init ───────────────────────────────── */
  renderOrders();
  </script>
</body>
</html>
