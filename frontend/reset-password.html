<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đặt lại mật khẩu — ShopNest</title>
  <meta name="description" content="Tạo mật khẩu mới cho tài khoản ShopNest." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <a href="index.html">🏠 Shop<span>Nest</span></a>
      </div>

      <!-- Invalid token state -->
      <div id="invalidState" style="display:none;">
        <div style="text-align:center;padding:24px 0;">
          <div style="font-size:48px;margin-bottom:12px;">⚠️</div>
          <h3 style="color:var(--primary);margin-bottom:8px;">Link không hợp lệ</h3>
          <p style="color:var(--text-secondary);font-size:14px;">Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.</p>
          <div style="margin-top:16px;">
            <a href="forgot-password.html" class="btn btn-primary btn-lg" style="display:inline-block;">Yêu cầu link mới</a>
          </div>
        </div>
      </div>

      <!-- Success state -->
      <div id="successState" style="display:none;">
        <div style="text-align:center;padding:24px 0;">
          <div style="font-size:48px;margin-bottom:12px;">🎉</div>
          <h3 style="color:#22c55e;margin-bottom:8px;">Đặt lại mật khẩu thành công!</h3>
          <p style="color:var(--text-secondary);font-size:14px;">Bạn có thể đăng nhập bằng mật khẩu mới.</p>
          <div style="margin-top:16px;">
            <a href="login.html" class="btn btn-primary btn-lg" style="display:inline-block;">Đăng nhập ngay</a>
          </div>
        </div>
      </div>

      <!-- Form -->
      <div id="formState">
        <h1 class="auth-title">Đặt lại mật khẩu</h1>
        <p class="auth-sub">Nhập mật khẩu mới cho tài khoản của bạn</p>

        <form id="resetForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="newPw">Mật khẩu mới</label>
            <div class="input-group">
              <input class="form-control" type="password" id="newPw" placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)" autocomplete="new-password" />
              <button type="button" class="toggle-pw" id="togglePw1" title="Hiển thị mật khẩu">👁️</button>
            </div>
            <div class="form-error" id="pwError"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPw">Xác nhận mật khẩu</label>
            <div class="input-group">
              <input class="form-control" type="password" id="confirmPw" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" />
              <button type="button" class="toggle-pw" id="togglePw2" title="Hiển thị mật khẩu">👁️</button>
            </div>
            <div class="form-error" id="confirmError"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Đặt lại mật khẩu</button>
        </form>
      </div>

      <div class="auth-switch">
        <a href="login.html">← Quay lại đăng nhập</a>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
  /* ============================================
     Reset Password Script
  ============================================ */

  const token = new URLSearchParams(location.search).get('token');

  if (!token) {
    document.getElementById('formState').style.display = 'none';
    document.getElementById('invalidState').style.display = 'block';
  }

  // Toggle password visibility
  document.getElementById('togglePw1').addEventListener('click', () => {
    const inp = document.getElementById('newPw');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    document.getElementById('togglePw1').textContent = inp.type === 'password' ? '👁️' : '🙈';
  });
  document.getElementById('togglePw2').addEventListener('click', () => {
    const inp = document.getElementById('confirmPw');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    document.getElementById('togglePw2').textContent = inp.type === 'password' ? '👁️' : '🙈';
  });

  const form = document.getElementById('resetForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const pwErr = document.getElementById('pwError');
    const confirmErr = document.getElementById('confirmError');
    pwErr.textContent = '';
    confirmErr.textContent = '';

    const newPw = document.getElementById('newPw').value;
    const confirmPw = document.getElementById('confirmPw').value;
    let valid = true;

    if (!newPw) {
      pwErr.textContent = 'Vui lòng nhập mật khẩu mới';
      valid = false;
    } else if (newPw.length < 6) {
      pwErr.textContent = 'Mật khẩu cần ít nhất 6 ký tự';
      valid = false;
    }

    if (newPw !== confirmPw) {
      confirmErr.textContent = 'Mật khẩu xác nhận không khớp';
      valid = false;
    }

    if (!valid) return;

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Đang xử lý...';

    try {
      await authAPI.resetPassword(token, newPw);
      document.getElementById('formState').style.display = 'none';
      document.getElementById('successState').style.display = 'block';
    } catch (err) {
      if (err.message.includes('hết hạn') || err.message.includes('không hợp lệ')) {
        document.getElementById('formState').style.display = 'none';
        document.getElementById('invalidState').style.display = 'block';
      } else {
        showToast(err.message || 'Có lỗi xảy ra', 'error');
        btn.disabled = false;
        btn.textContent = 'Đặt lại mật khẩu';
      }
    }
  });
  </script>
</body>
</html>
